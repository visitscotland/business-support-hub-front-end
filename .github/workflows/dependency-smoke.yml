name: Dependency smoke tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Dependency smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'

    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use production Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # Use the checked-in Yarn release without relying on runner/Corepack defaults.
      - name: Install dependencies from lockfile
        run: node .yarn/releases/yarn-4.14.1.cjs install --immutable

      - name: Run smoke harness unit tests
        run: node .yarn/releases/yarn-4.14.1.cjs test:smoke:unit

      - name: Install Chromium and Linux dependencies
        run: node .yarn/releases/yarn-4.14.1.cjs playwright install --with-deps chromium

      - name: Record runtime and browser diagnostics
        run: node .yarn/releases/yarn-4.14.1.cjs test:smoke:diagnostics

      - name: Lint, build and test production homepage
        run: node .yarn/releases/yarn-4.14.1.cjs test:smoke

      - name: Upload smoke logs and browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-smoke-results
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 7
